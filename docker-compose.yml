services:
  n8n:
    build: . # Usa o novo Dockerfile multi-stage único
    image: b2list-n8n-consolidated
    container_name: n8n-main
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_USER_ID=0
      - N8N_GROUP_ID=0
      - N8N_BLOCK_XML_EXTERNAL_ENTITIES=true
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_HOST=b2list-desafio-head.onrender.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://b2list-desafio-head.onrender.com:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - NODE_OPTIONS=--max-old-space-size=512
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      
      # AWS credentials
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-sa-east-1}
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT}
      - NODES_EXCLUDE=[]      # Persistência de Banco (Lendo do .env)
      
      # n8n supabase postgres
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false
      
      # Segurança e DNS
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_OPTIONS=--dns-result-order=ipv4first
           
    volumes:
      - ./n8n_data:/root/.n8n
      - ./workflows:/root/workflows
      - ./aws_config:/root/.aws
      - ./n8n_data_files:/root/data
      # Removido o compartilhamento do docker.sock para ser compatível com o Render
    user: "0:0"



