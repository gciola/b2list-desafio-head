services:
  n8n:
    build: .
    image: b2list-n8n-consolidated
    container_name: n8n-main
    restart: always
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_USER_ID=0
      - N8N_GROUP_ID=0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT}
    volumes:
      - ./n8n_data:/root/.n8n
      - ./workflows:/root/workflows
      - ./aws_config:/root/.aws
      - /var/run/docker.sock:/var/run/docker.sock # Essencial para o n8n comandar containers
    user: "0:0"

  pharmacy-generator:
    image: b2list-n8n-consolidated # Usa a mesma imagem buildada acima
    container_name: pharmacy-generator
    command: python3 /opt/pharmacy/generate_pharmacy.py
    env_file: .env
    profiles:
      - manual
    deploy:
      resources:
        limits:
          memory: 512M